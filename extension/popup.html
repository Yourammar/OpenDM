<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 290px; margin: 0; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; color: #202124; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: #1a73e8; color: #fff; }
  header img { width: 28px; height: 28px; }
  header b { font-size: 15px; }
  .status { padding: 10px 16px; border-bottom: 1px solid #e0e0e0; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #9aa0a6; }
  .dot.on { background: #1e8e3e; } .dot.off { background: #d93025; }
  label { display: flex; align-items: center; justify-content: space-between; padding: 9px 16px; cursor: pointer; }
  label:hover { background: #f1f3f4; }
  input { width: 16px; height: 16px; accent-color: #1a73e8; }
  .actions { padding: 10px 16px 14px; border-top: 1px solid #e0e0e0; }
  button { width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #1a73e8; color: #fff; font-weight: 600; cursor: pointer; }
  button:hover { background: #1765cc; }
  .hint { color: #5f6368; font-size: 12px; padding: 0 16px 10px; }
</style>
</head>
<body>
  <header><img src="icons/48.png" alt=""><b>OpenDM</b></header>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">Checking app...</span></div>
  <label>Button on videos <input type="checkbox" id="videoButton"></label>
  <label>Button on images <input type="checkbox" id="imageButton"></label>
  <label>Take over browser downloads <input type="checkbox" id="catchDownloads"></label>
  <div class="hint">Right-click any link, image, video or page for "Download with OpenDM".</div>
  <div class="actions"><button id="grab">Download video from this tab</button></div>
  <script src="popup.js"></script>
</body>
</html>
